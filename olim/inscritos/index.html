<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impact Lab Olim · Meet the group</title>
<style>
@font-face{font-family:Rubik;src:url(../landing/assets/Rubik-Variable.woff2)}:root{--cream:#f4f1ea;--ink:#102331;--blue:#315efb;--acid:#d8ff54;--coral:#ff7047}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:Rubik,Arial,sans-serif;overflow:hidden}.deck{height:100%;position:relative}.slide{height:100%;padding:7vh 7vw;display:grid;grid-template-rows:auto 1fr auto;position:absolute;inset:0;opacity:0;transform:translateX(40px);transition:.35s ease;pointer-events:none}.slide.active{opacity:1;transform:none;pointer-events:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:13px;font-weight:760;font-size:1.25vw}.mark{width:2.4vw;height:2.4vw;min-width:32px;min-height:32px;border-radius:.7vw;background:var(--ink);box-shadow:.5vw .5vw 0 var(--acid)}.count{font-weight:700;color:#66747d}.content{display:grid;align-content:center;max-width:1400px}.kicker{text-transform:uppercase;letter-spacing:.18em;color:var(--blue);font-weight:800;font-size:clamp(14px,1.1vw,22px)}h1{font-size:clamp(68px,8vw,150px);line-height:.88;letter-spacing:-.07em;margin:3vh 0 4vh;max-width:14ch}.fact{font-size:clamp(28px,3.2vw,62px);line-height:1.08;max-width:25ch;font-weight:520}.line{height:1px;background:#aeb7ba}.controls{position:fixed;right:28px;bottom:24px;display:flex;gap:8px;z-index:10}.controls button{width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);background:#ffffffaa;font:700 20px Rubik;cursor:pointer}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:40px}.empty h1{font-size:clamp(45px,7vw,110px);max-width:13ch}.empty p{font-size:20px;color:#66747d}.status{position:fixed;left:28px;bottom:25px;color:#66747d;font-size:13px}.accent{position:absolute;right:-8vw;top:24vh;width:34vw;height:34vw;border-radius:50%;background:var(--coral);opacity:.16;filter:blur(1px)}
</style></head><body><main id="deck" class="deck"><section class="empty"><div><p class="kicker">Impact Lab Olim · Meet the group</p><h1>Loading the people behind the ideas.</h1><p id="message">Connecting to registrations…</p></div></section></main><div class="controls"><button id="prev" aria-label="Previous">←</button><button id="next" aria-label="Next">→</button><button id="full" aria-label="Fullscreen">F</button></div><div class="status">← / → · Space · F</div>
<script>
const GAS_URL='PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';let people=[],index=0;
function callback(data){people=(data&&data.approved)||[];render()}
function render(){const deck=document.querySelector('#deck');if(!people.length){document.querySelector('#message').textContent='No approved quiz results yet.';return}deck.innerHTML=people.map((p,i)=>`<section class="slide ${i===0?'active':''}"><i class="accent"></i><div class="top"><div class="brand"><span class="mark"></span>Impact Lab <b>Olim</b></div><span class="count">${String(i+1).padStart(2,'0')} / ${String(people.length).padStart(2,'0')}</span></div><div class="content"><p class="kicker">Meet ${escapeHtml(p.name)}</p><h1>${escapeHtml(p.name)}</h1><div class="fact">${escapeHtml(p.fact)}</div></div><div class="line"></div></section>`).join('')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function go(n){if(!people.length)return;document.querySelectorAll('.slide')[index].classList.remove('active');index=(n+people.length)%people.length;document.querySelectorAll('.slide')[index].classList.add('active')}
document.querySelector('#prev').onclick=()=>go(index-1);document.querySelector('#next').onclick=()=>go(index+1);document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(index-1);if(e.key==='ArrowRight'||e.key===' ')go(index+1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen()});
if(GAS_URL.startsWith('PASTE_'))document.querySelector('#message').textContent='Paste the Apps Script /exec URL in this file after deployment.';else{const s=document.createElement('script');s.src=GAS_URL+'?action=approved&callback=callback';s.onerror=()=>document.querySelector('#message').textContent='Could not load registrations.';document.head.appendChild(s)}
</script></body></html>
